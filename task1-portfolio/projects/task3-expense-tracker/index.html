<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <a class="back" href="../../index.html#projects">&larr; Back to portfolio</a>
    <h1>Expense tracker</h1>

    <section class="cards" aria-label="Summary" aria-live="polite">
      <div class="stat income"><span>Total income</span><strong id="sum-income">0</strong></div>
      <div class="stat expense"><span>Total expenses</span><strong id="sum-expense">0</strong></div>
      <div class="stat balance"><span>Balance</span><strong id="sum-balance">0</strong></div>
    </section>

    <form id="tx-form" novalidate>
      <h2 id="form-title">Add a transaction</h2>
      <fieldset class="type">
        <legend class="sr">Type</legend>
        <label><input type="radio" name="type" value="expense" checked> Expense</label>
        <label><input type="radio" name="type" value="income"> Income</label>
      </fieldset>
      <div class="row">
        <div class="grow">
          <label for="desc">Description</label>
          <input id="desc" type="text" maxlength="80" placeholder="e.g. Groceries" autocomplete="off">
        </div>
        <div>
          <label for="amount">Amount (INR)</label>
          <input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00">
        </div>
        <div>
          <label for="category">Category</label>
          <select id="category"></select>
        </div>
        <div>
          <label for="date">Date</label>
          <input id="date" type="date">
        </div>
      </div>
      <p id="form-error" class="error" role="alert"></p>
      <div class="row">
        <button id="submit-btn" type="submit">Add transaction</button>
        <button id="cancel-edit" class="ghost" type="button" hidden>Cancel edit</button>
      </div>
    </form>

    <section class="history">
      <div class="history-head">
        <h2>History</h2>
        <div class="filters">
          <select id="filter-type" aria-label="Filter by type">
            <option value="all">Income and expenses</option>
            <option value="expense">Expenses only</option>
            <option value="income">Income only</option>
          </select>
          <select id="filter-category" aria-label="Filter by category"></select>
        </div>
      </div>
      <p id="filtered-note" class="note" hidden></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Date</th><th>Description</th><th>Category</th><th class="num">Amount</th><th><span class="sr">Actions</span></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden></p>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
